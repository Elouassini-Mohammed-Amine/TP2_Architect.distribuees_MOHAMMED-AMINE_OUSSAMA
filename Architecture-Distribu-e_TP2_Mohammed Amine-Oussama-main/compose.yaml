
services:

  etudiants:
    build:
      context: ./ServiceEtudiants
    image: serviceetudiants:v1
    ports:
      - "8081:8081"

  cours:
    build:
      context: ./ServiceCours
    image: servicecours:v1
    ports:
      - "8082:8082"
    environment:
      ETUDIANTS_URL: http://etudiants:8081
    depends_on:
      - etudiants
